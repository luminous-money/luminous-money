# Routing by top-level prefix: /api for every API, /ui for the PWA. Services serve under their
# full prefix, so nothing is stripped.
#
# Every API route except auth's own goes through the `session` middleware: Traefik asks auth's
# verify endpoint first, refuses the request (401) if there's no valid session, and otherwise
# forwards it with X-User-Id (and X-User-Name, X-User-Email) set from auth's answer (replacing anything
# the client sent).
http:
  routers:
    auth-api:
      rule: PathPrefix(`/api/auth/v1`)
      entryPoints: [web]
      service: auth
    ledger-api:
      rule: PathPrefix(`/api/ledger/v1`)
      entryPoints: [web]
      service: ledger
      middlewares: [session]
    app-api:
      rule: PathPrefix(`/api/app/v1`)
      entryPoints: [web]
      service: app
      middlewares: [session]
    app-ui:
      rule: PathPrefix(`/ui`)
      entryPoints: [web]
      service: app
    root:
      rule: Path(`/`)
      entryPoints: [web]
      service: app
      middlewares: [to-ui]
  middlewares:
    session:
      forwardAuth:
        address: http://auth:3000/api/auth/v1/verify
        authResponseHeaders: [X-User-Id, X-User-Name, X-User-Email]
    to-ui:
      redirectRegex:
        regex: ^(https?://[^/]+)/$
        replacement: ${1}/ui/
  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth:3000
    ledger:
      loadBalancer:
        servers:
          - url: http://ledger:8000
    app:
      loadBalancer:
        servers:
          - url: http://app:3000
