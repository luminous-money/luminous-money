# Traefik static config. Routing lives in routes.yml (file provider), so the same config works
# under `docker compose` and `docker stack deploy`, and Traefik needs no Docker socket.
entryPoints:
  web:
    address: ":80"
providers:
  file:
    filename: /etc/traefik/routes.yml
log:
  level: INFO
accessLog: {}
