# Routing by top-level prefix: /api for every API, /ui for the PWA. Services serve under their
# full prefix, so nothing is stripped. Routers take the default entry points (HTTP, and HTTPS
# when the gateway has a domain: entrypoint.sh).
#
# Every API route except auth's own goes through the `session` middleware: Traefik asks auth's
# verify endpoint first, refuses the request (401) if there's no valid session, and otherwise
# forwards it with X-User-Id (and X-User-Name, X-User-Email, X-User-Email-Verified) set from
# auth's answer, replacing anything the client sent: auth always sends all four.
http:
  routers:
    auth-api:
      rule: PathPrefix(`/api/auth/v1`)
      service: auth
      middlewares: [security-headers]
    ledger-api:
      rule: PathPrefix(`/api/ledger/v1`)
      service: ledger
      middlewares: [security-headers, session]
    app-api:
      rule: PathPrefix(`/api/app/v1`)
      service: app
      middlewares: [security-headers, session]
    ai-api:
      rule: PathPrefix(`/api/ai/v1`)
      service: ai
      middlewares: [security-headers, session]
    shops-api:
      rule: PathPrefix(`/api/shops/v1`)
      service: shops
      middlewares: [security-headers, session]
    # The MCP server (Claude and other AI clients). Without a token, auth's 401 says where to
    # sign in (OAuth's metadata, below).
    mcp-api:
      rule: PathPrefix(`/api/mcp/v1`)
      service: mcp
      middlewares: [security-headers, session]
    # OAuth's metadata for MCP clients (RFC 9728, RFC 8414): public, at the root, as they look
    # for it there.
    oauth-metadata:
      rule: PathPrefix(`/.well-known/oauth-`)
      service: auth
      middlewares: [security-headers]
    # The stack's health, for uptime monitors: public, so no session (app answers it).
    health:
      rule: Path(`/api/health`)
      service: app
      middlewares: [security-headers]
    app-ui:
      rule: PathPrefix(`/ui`)
      service: app
      middlewares: [security-headers, ui-policy]
    root:
      rule: Path(`/`)
      service: app
      middlewares: [security-headers, to-ui]
  middlewares:
    session:
      forwardAuth:
        address: http://auth:3000/api/auth/v1/verify
        # Pass on the request's X-Forwarded-* (Proto: https behind a TLS proxy), which the
        # entrypoints' forwardedHeaders.trustedIPs already strip from anyone untrusted.
        trustForwardHeader: true
        authResponseHeaders: [X-User-Id, X-User-Name, X-User-Email, X-User-Email-Verified]
    # Every response (scale readiness, S2): HSTS over HTTPS only (TLS here, or a trusted proxy's
    # X-Forwarded-Proto: https, which Traefik doesn't count as HTTPS without sslProxyHeaders), no
    # type guessed, never framed (the OAuth consent is a click away from giving a book away), and
    # no address sent to other sites. No includeSubDomains or preload: the operator's other hosts
    # are theirs to decide.
    security-headers:
      headers:
        stsSeconds: 31536000
        sslProxyHeaders:
          X-Forwarded-Proto: https
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: same-origin
    # The PWA's pages and scripts: nothing but its own origin. Styles may be inline (charts'
    # tooltips write them into their markup); images may be data: and blob: (a receipt's preview
    # before it's sent). The browser tests fail on any violation (tests/ui/src/fixtures.ts).
    ui-policy:
      headers:
        contentSecurityPolicy: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';
          worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self';
          form-action 'self'; frame-ancestors 'none'
    to-ui:
      redirectRegex:
        regex: ^(https?://[^/]+)/$
        replacement: ${1}/ui/
  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth:3000
    ledger:
      loadBalancer:
        servers:
          - url: http://ledger:8000
    app:
      loadBalancer:
        servers:
          - url: http://app:3000
    ai:
      loadBalancer:
        servers:
          - url: http://ai:3000
    shops:
      loadBalancer:
        servers:
          - url: http://shops:8000
    mcp:
      loadBalancer:
        servers:
          - url: http://mcp:3000
