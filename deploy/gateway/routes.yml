# Routing by top-level prefix: /api for every API, /ui for the PWA. Services serve under their
# full prefix, so nothing is stripped. Routers take the default entry points (HTTP, and HTTPS
# when the gateway has a domain: entrypoint.sh).
#
# Every API route except auth's own goes through the `session` middleware: Traefik asks auth's
# verify endpoint first, refuses the request (401) if there's no valid session, and otherwise
# forwards it with X-User-Id (and X-User-Name, X-User-Email, X-User-Email-Verified) set from
# auth's answer, replacing anything the client sent: auth always sends all four.
http:
  routers:
    auth-api:
      rule: PathPrefix(`/api/auth/v1`)
      service: auth
    ledger-api:
      rule: PathPrefix(`/api/ledger/v1`)
      service: ledger
      middlewares: [session]
    app-api:
      rule: PathPrefix(`/api/app/v1`)
      service: app
      middlewares: [session]
    ai-api:
      rule: PathPrefix(`/api/ai/v1`)
      service: ai
      middlewares: [session]
    # The stack's health, for uptime monitors: public, so no session (app answers it).
    health:
      rule: Path(`/api/health`)
      service: app
    app-ui:
      rule: PathPrefix(`/ui`)
      service: app
    root:
      rule: Path(`/`)
      service: app
      middlewares: [to-ui]
  middlewares:
    session:
      forwardAuth:
        address: http://auth:3000/api/auth/v1/verify
        # Pass on the request's X-Forwarded-* (Proto: https behind a TLS proxy), which the
        # entrypoints' forwardedHeaders.trustedIPs already strip from anyone untrusted.
        trustForwardHeader: true
        authResponseHeaders: [X-User-Id, X-User-Name, X-User-Email, X-User-Email-Verified]
    to-ui:
      redirectRegex:
        regex: ^(https?://[^/]+)/$
        replacement: ${1}/ui/
  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth:3000
    ledger:
      loadBalancer:
        servers:
          - url: http://ledger:8000
    app:
      loadBalancer:
        servers:
          - url: http://app:3000
    ai:
      loadBalancer:
        servers:
          - url: http://ai:3000
