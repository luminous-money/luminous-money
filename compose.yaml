# The product: the whole fava-beans stack. Works with both
#   docker compose up -d
#   docker stack deploy -c compose.yaml fava-beans
# so it sticks to Compose-spec features both support and uses prebuilt images (no `build:`).
# Build the images with `docker buildx bake` (see docker-bake.hcl).

x-restart: &restart
  restart_policy:
    condition: any

services:
  traefik:
    image: traefik:v3
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${FAVA_BEANS_PORT:-8080}:80"
    configs:
      - source: traefik-static
        target: /etc/traefik/traefik.yml
      - source: traefik-routes
        target: /etc/traefik/routes.yml
    deploy: *restart

  # Every service keeps its database on the one data volume (ledger.sqlite, auth.sqlite,
  # app.sqlite), so backing up the volume backs up everything. All run as UID 1000.
  auth:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/auth:${FAVA_BEANS_VERSION:-dev}
    environment:
      # Signs session tokens. Set your own (32+ characters) before exposing the stack.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-insecure-development-secret-change-me-0123456789}
      # Test stacks only: lets `login` take an email and log in a separate user for it.
      AUTH_TEST_USERS: ${AUTH_TEST_USERS:-false}
    volumes:
      - data:/data
    deploy: *restart

  ledger:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/ledger:${FAVA_BEANS_VERSION:-dev}
    volumes:
      - data:/data # the system of record: back this up (or use the backup API)
    deploy: *restart

  app:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/app:${FAVA_BEANS_VERSION:-dev}
    environment:
      LEDGER_URL: http://ledger:8000
    volumes:
      - data:/data
    deploy: *restart

configs:
  traefik-static:
    file: ./deploy/traefik/traefik.yml
  traefik-routes:
    file: ./deploy/traefik/routes.yml

volumes:
  data:
