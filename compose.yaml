# The product: the whole luminous-money stack. Works with both
#   docker compose up -d
#   docker stack deploy -c compose.yaml luminous-money
# so it sticks to Compose-spec features both support and uses prebuilt images (no `build:`).
# Build the images with `docker buildx bake` (see docker-bake.hcl).

x-restart: &restart
  restart_policy:
    condition: any

# Every service's log is capped (5 files of 10 MB), so a long-running server doesn't fill its
# disk. `luminous-money logs` (or `docker compose logs`) reads them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The gateway (deploy/gateway): Traefik with Luminous Money's routes inside. Plain HTTP on
  # LUMINOUS_MONEY_PORT; with LUMINOUS_MONEY_DOMAIN (and LUMINOUS_MONEY_ACME_EMAIL), HTTPS too, with a Let's
  # Encrypt certificate: then publish 80 and 443 (LUMINOUS_MONEY_PORT=80, LUMINOUS_MONEY_HTTPS_PORT=443).
  # LUMINOUS_MONEY_BIND=127.0.0.1 keeps it to this machine.
  traefik:
    image: ${LUMINOUS_MONEY_REGISTRY:-luminous-money}/gateway:${LUMINOUS_MONEY_VERSION:-dev}
    ports:
      - "${LUMINOUS_MONEY_BIND:-0.0.0.0}:${LUMINOUS_MONEY_PORT:-8080}:80"
      # Unset (no domain): any free port, so stacks side by side don't collide over it.
      - "${LUMINOUS_MONEY_BIND:-0.0.0.0}:${LUMINOUS_MONEY_HTTPS_PORT:-}:443"
    environment:
      - LUMINOUS_MONEY_DOMAIN
      - LUMINOUS_MONEY_ACME_EMAIL
      - LUMINOUS_MONEY_TRUSTED_PROXIES
    volumes:
      - certs:/certs # its certificate, with LUMINOUS_MONEY_DOMAIN
    logging: *logging
    deploy: *restart

  # Every service keeps its database on the one data volume (ledger.sqlite, auth.sqlite,
  # app.sqlite, ai.sqlite, and the attachments), so it's all `luminous-money backup` needs. All run as
  # UID 1000. Each says its health at /health (their images' healthchecks), and app sums them up
  # publicly at /api/health.
  #
  # auth and app read their settings through @wymp/config-simple: APP_ENV picks the
  # production-safe defaults baked into each image (services/*/.env/<APP_ENV>), and anything set
  # here (from your shell, or a .env file next to this one) overrides them. A variable listed
  # without a value is passed through only if it's set.
  auth:
    image: ${LUMINOUS_MONEY_REGISTRY:-luminous-money}/auth:${LUMINOUS_MONEY_VERSION:-dev}
    environment:
      - APP_ENV=${APP_ENV:-production}
      # Email, for password resets and confirming addresses (optional: without it, resets go
      # through `node dist/cli.js reset-link`). LUMINOUS_MONEY_PUBLIC_URL is where the links in
      # emails point, e.g. https://books.example.com.
      - SMTP_URL
      - MAIL_FROM
      - LUMINOUS_MONEY_PUBLIC_URL
      # New passwords are checked against Have I Been Pwned (by hash prefix only); default true.
      - AUTH_BREACHED_PASSWORDS
      - AUTH_SIGNUPS_PER_HOUR
      # Who may create an account: public (anyone; the default), or private (only the emails in
      # LUMINOUS_MONEY_ALLOWED_EMAILS, comma-separated).
      - LUMINOUS_MONEY_SERVICE_MODE
      - LUMINOUS_MONEY_ALLOWED_EMAILS
    volumes:
      - data:/data
    logging: *logging
    deploy: *restart

  ledger:
    image: ${LUMINOUS_MONEY_REGISTRY:-luminous-money}/ledger:${LUMINOUS_MONEY_VERSION:-dev}
    volumes:
      - data:/data # the system of record: back this up (or use the backup API)
    logging: *logging
    deploy: *restart

  app:
    image: ${LUMINOUS_MONEY_REGISTRY:-luminous-money}/app:${LUMINOUS_MONEY_VERSION:-dev}
    environment:
      - APP_ENV=${APP_ENV:-production}
      # Required: encrypts stored bank-feed (SimpleFIN) credentials. 32 random bytes, base64:
      # `openssl rand -base64 32`. app won't start without it.
      - SIMPLEFIN_ENCRYPTION_KEY
      # With a domain, app watches the gateway's certificate for /api/health.
      - LUMINOUS_MONEY_DOMAIN
      # The system page: the admins (emails; once confirmed), whether to look for new releases
      # (off, notify, auto), and with auto, when the host's timer upgrades.
      - LUMINOUS_MONEY_ADMINS
      - LUMINOUS_MONEY_UPDATES
      - LUMINOUS_MONEY_UPGRADE_AT
      # The SimpleFIN servers setup tokens may point to (default: the SimpleFIN Bridge's).
      - SIMPLEFIN_HOSTS
      # daily (the default): bank feeds sync once a day by themselves. on-demand: only when
      # someone taps Sync now.
      - LUMINOUS_MONEY_SIMPLEFIN_MODE
      # External categorization providers (docs/categorizer-api.md).
      - CATEGORIZERS
    volumes:
      - data:/data
    logging: *logging
    deploy: *restart

  # AI (M16): each book's AI settings and provider credential (sealed with AI_ENCRYPTION_KEY),
  # and reading receipts. Optional: without it, the app works as before and offers nothing AI.
  ai:
    image: ${LUMINOUS_MONEY_REGISTRY:-luminous-money}/ai:${LUMINOUS_MONEY_VERSION:-dev}
    environment:
      - APP_ENV=${APP_ENV:-production}
      # Required: encrypts each book's provider API key. 32 random bytes, base64:
      # `openssl rand -base64 32`.
      - AI_ENCRYPTION_KEY
      - AI_CLAUDE_EXTRACT_MODEL
      - AI_CLAUDE_CATEGORIZE_MODEL
    volumes:
      - data:/data
    logging: *logging
    deploy: *restart

volumes:
  data:
  certs:
