[project]
name = "luminous-money-shops"
version = "0.1.0"
description = "Reads shops' order histories (Amazon first) for Luminous Money books."
license = "GPL-2.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amazon-orders[browser]==5.2.1",
    "cryptography>=43",
    "fastapi>=0.115",
    "pyotp>=2.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shops"]
