[project]
name = "fava-beans-ledger"
version = "0.1.0"
description = "System of record for fava-beans books, with Beancount as the accounting engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beancount>=3.2,<3.3",
    "beanprice>=2.1.0",
    "beanquery>=0.2,<0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
