# Overlay for the end-to-end suites. scripts/e2e.sh (`pnpm e2e`) runs the stack under its own
# project name with fresh volumes, runs each suite against it through Traefik with
# `docker compose run`, then tears it down. The `tests` profile keeps `up` from starting them.
services:
  traefik:
    ports: !reset []

  # APP_ENV=test: each service's .env/test (test users, mail to Mailpit, the fake SimpleFIN
  # server, no outside calls). Each test logs in a user of its own, so tests never share books.
  auth:
    environment:
      - APP_ENV=test
    depends_on: [mailpit]

  app:
    environment:
      - APP_ENV=test
    depends_on: [simplefin-fake]

  ai:
    environment:
      - APP_ENV=test

  simplefin-fake:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/simplefin-fake:${FAVA_BEANS_VERSION:-dev}

  mailpit:
    image: axllent/mailpit:v1.27

  e2e:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/e2e:${FAVA_BEANS_VERSION:-dev}
    profiles: [tests]
    depends_on: [traefik, auth, ledger, app, ai, mailpit, simplefin-fake]

  ui:
    image: ${FAVA_BEANS_REGISTRY:-fava-beans}/ui-tests:${FAVA_BEANS_VERSION:-dev}
    profiles: [tests]
    depends_on: [traefik, auth, ledger, app, ai, mailpit, simplefin-fake]
    ipc: host # Chromium needs more shared memory than Docker's default
